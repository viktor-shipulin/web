<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ event.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container my-5">
    <a href="/" class="btn btn-outline-secondary btn-sm mb-4">← Назад</a>
    <h1 class="mb-3">{{ event.title }}</h1>
    <p class="text-muted">{{ event.summary }}</p>
    <p>{{ event.description }}</p>
    <p><strong>Дата:</strong> {{ event.starts_at }}</p>
    <div class="d-flex gap-2 mt-4">
        <a href="/{{ event.pk }}/edit/" class="btn btn-outline-secondary btn-sm">Изменить</a>
        <a href="/{{ event.pk }}/delete/" class="btn btn-outline-danger btn-sm">Удалить</a>
    </div>
</main>
</body>
</html>
