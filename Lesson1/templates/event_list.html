<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Event Hub</a>
  </div>
</nav>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="m-0">Мероприятия</h1>
        <a href="/create/" class="btn btn-success">+ Создать</a>
    </div>

    <div class="row g-4">
        {% for ev in events %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ ev.title }}</h5>
                    <p class="card-text">{{ ev.description }}</p>
                    <div class="mt-auto d-flex gap-2">
                        <a href="/{{ ev.pk }}/" class="btn btn-primary btn-sm">Подробнее</a>
                        <a href="/{{ ev.pk }}/edit/" class="btn btn-outline-secondary btn-sm">Изменить</a>
                        <a href="/{{ ev.pk }}/delete/" class="btn btn-outline-danger btn-sm">Удалить</a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-muted">Пока нет мероприятий.</p>
        {% endfor %}
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
